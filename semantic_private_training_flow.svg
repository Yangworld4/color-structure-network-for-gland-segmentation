<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320"
     viewBox="0 0 1800 1320" role="img"
     aria-labelledby="title description">
  <title id="title">Semantic-Private 异构双分支训练流程</title>
  <desc id="description">
    展示 appearance 与 structure 双分支从输入、分层特征、投影、监督和无监督
    标签构造，到语义一致、私有互补、分割及交叉伪监督损失和反向传播的完整流程。
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="appearanceFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="structureFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="semanticFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="privateFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="lossFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="1" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7"
                    flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e11d48"/>
    </marker>

    <style>
      text {
        font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        fill: #172033;
      }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #526074; }
      .section { font-size: 16px; font-weight: 700; letter-spacing: 1px; fill: #64748b; }
      .box-title { font-size: 19px; font-weight: 750; }
      .body { font-size: 15px; fill: #42526a; }
      .small { font-size: 13px; fill: #526074; }
      .formula { font-size: 15px; font-weight: 650; fill: #334155; }
      .badge { font-size: 13px; font-weight: 750; fill: #ffffff; }
      .box { stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-a { fill: none; stroke: #ea580c; stroke-width: 2.4; marker-end: url(#arrowOrange); }
      .arrow-s { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .arrow-loss { fill: none; stroke: #e11d48; stroke-width: 2.4; marker-end: url(#arrowRed); }
      .guide { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect width="1800" height="1320" fill="url(#background)"/>

  <!-- Header -->
  <text x="70" y="62" class="title">Semantic-Private 异构双分支训练流程</text>
  <text x="70" y="94" class="subtitle">
    语义层对齐类别中心 · 私有层保留模态互补 · 最终层完成分割与交叉伪监督
  </text>
  <rect x="1460" y="35" width="270" height="48" rx="24" fill="#4338ca"/>
  <text x="1595" y="65" text-anchor="middle" class="badge">
    feature_loss_mode = semantic_private
  </text>

  <!-- Column headings -->
  <text x="75" y="140" class="section">① 数据与双视图</text>
  <text x="410" y="140" class="section">② 双分支网络</text>
  <text x="745" y="140" class="section">③ 分层特征</text>
  <text x="1070" y="140" class="section">④ 视图独立投影</text>
  <text x="1390" y="140" class="section">⑤ 优化目标</text>

  <!-- Input group -->
  <rect x="60" y="175" width="245" height="520" class="box"
        fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="82" y="205" width="200" height="86" rx="13"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="182" y="235" text-anchor="middle" class="box-title">有标注图像</text>
  <text x="182" y="262" text-anchor="middle" class="body">image + GT mask</text>

  <rect x="82" y="315" width="200" height="86" rx="13"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="182" y="345" text-anchor="middle" class="box-title">无标注图像</text>
  <text x="182" y="372" text-anchor="middle" class="body">image only</text>

  <path d="M182 291 L182 315" class="guide"/>
  <path d="M282 248 L320 248 L320 446" class="arrow"/>
  <path d="M282 358 L320 358" class="arrow"/>

  <rect x="82" y="438" width="200" height="82" rx="13"
        fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="182" y="468" text-anchor="middle" class="box-title">共享几何增强</text>
  <text x="182" y="495" text-anchor="middle" class="body">保证空间严格对齐</text>

  <path d="M182 401 L182 438" class="arrow"/>

  <rect x="82" y="548" width="200" height="57" rx="13"
        fill="url(#appearanceFill)" stroke="#fb923c" stroke-width="1.4"/>
  <text x="182" y="583" text-anchor="middle" class="box-title">Appearance：RGB</text>

  <rect x="82" y="615" width="200" height="67" rx="13"
        fill="url(#structureFill)" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="182" y="642" text-anchor="middle" class="box-title">Structure 结构视图</text>
  <text x="182" y="668" text-anchor="middle" class="body">H / Gray / Sobel</text>

  <path d="M182 520 L182 538 L182 548" class="arrow-a"/>
  <path d="M182 520 L310 520 L310 649 L282 649" class="arrow-s"/>

  <!-- Networks -->
  <rect x="385" y="205" width="255" height="205" class="box"
        fill="url(#appearanceFill)" stroke="#f97316"/>
  <rect x="405" y="222" width="102" height="29" rx="14" fill="#ea580c"/>
  <text x="456" y="242" text-anchor="middle" class="badge">分支 1</text>
  <text x="512" y="288" text-anchor="middle" class="box-title">Appearance XNet</text>
  <text x="512" y="320" text-anchor="middle" class="body">学习颜色、染色与纹理</text>
  <text x="512" y="348" text-anchor="middle" class="small">参数 θa · 独立优化器</text>
  <rect x="420" y="365" width="185" height="26" rx="13" fill="#fff7ed"/>
  <text x="512" y="383" text-anchor="middle" class="small">输入：[B,3,H,W]</text>

  <rect x="385" y="475" width="255" height="205" class="box"
        fill="url(#structureFill)" stroke="#3b82f6"/>
  <rect x="405" y="492" width="102" height="29" rx="14" fill="#2563eb"/>
  <text x="456" y="512" text-anchor="middle" class="badge">分支 2</text>
  <text x="512" y="558" text-anchor="middle" class="box-title">Structure XNet</text>
  <text x="512" y="590" text-anchor="middle" class="body">学习核、轮廓与形态</text>
  <text x="512" y="618" text-anchor="middle" class="small">参数 θs · 独立优化器</text>
  <rect x="420" y="635" width="185" height="26" rx="13" fill="#eff6ff"/>
  <text x="512" y="653" text-anchor="middle" class="small">输入：[B,3,H,W]</text>

  <path d="M282 576 L350 576 L350 308 L385 308" class="arrow-a"/>
  <path d="M282 649 L385 578" class="arrow-s"/>

  <!-- Hierarchical features -->
  <rect x="700" y="175" width="300" height="555" class="box"
        fill="#ffffff" stroke="#cbd5e1"/>

  <rect x="725" y="205" width="250" height="115" rx="14"
        fill="url(#semanticFill)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="850" y="236" text-anchor="middle" class="box-title">Semantic 特征</text>
  <text x="850" y="265" text-anchor="middle" class="body">b1_3_3，上采样前</text>
  <text x="850" y="293" text-anchor="middle" class="formula">[B, 256, H/4, W/4]</text>

  <rect x="725" y="345" width="250" height="115" rx="14"
        fill="url(#privateFill)" stroke="#10b981" stroke-width="1.5"/>
  <text x="850" y="376" text-anchor="middle" class="box-title">Private 特征</text>
  <text x="850" y="405" text-anchor="middle" class="body">b1_2_3，上采样前</text>
  <text x="850" y="433" text-anchor="middle" class="formula">[B, 128, H/2, W/2]</text>

  <rect x="725" y="485" width="250" height="115" rx="14"
        fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="850" y="516" text-anchor="middle" class="box-title">Final 特征与 Logits</text>
  <text x="850" y="545" text-anchor="middle" class="body">b1_1_3 → 1×1 分类头</text>
  <text x="850" y="573" text-anchor="middle" class="formula">F：[B,64,H,W] · P：[B,C,H,W]</text>

  <rect x="725" y="630" width="250" height="72" rx="14"
        fill="#fefce8" stroke="#eab308" stroke-width="1.4"/>
  <text x="850" y="658" text-anchor="middle" class="box-title">两个分支均输出以上三层</text>
  <text x="850" y="684" text-anchor="middle" class="small">结构相同、参数独立、空间对齐</text>

  <path d="M640 285 L680 285 L680 262 L725 262" class="arrow-a"/>
  <path d="M640 318 L675 318 L675 402 L725 402" class="arrow-a"/>
  <path d="M640 350 L670 350 L670 542 L725 542" class="arrow-a"/>
  <path d="M640 555 L660 555 L660 275 L725 275" class="arrow-s"/>
  <path d="M640 590 L655 590 L655 415 L725 415" class="arrow-s"/>
  <path d="M640 625 L650 625 L650 555 L725 555" class="arrow-s"/>

  <!-- Projection heads -->
  <rect x="1050" y="175" width="285" height="555" class="box"
        fill="#ffffff" stroke="#cbd5e1"/>

  <rect x="1075" y="205" width="235" height="145" rx="14"
        fill="url(#semanticFill)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1192" y="235" text-anchor="middle" class="box-title">Semantic 投影头 × 2</text>
  <text x="1192" y="265" text-anchor="middle" class="body">Appearance：Psem,a</text>
  <text x="1192" y="290" text-anchor="middle" class="body">Structure：Psem,s</text>
  <text x="1192" y="322" text-anchor="middle" class="formula">1×1 Conv 256→32 + GN + GELU</text>

  <rect x="1075" y="385" width="235" height="145" rx="14"
        fill="url(#privateFill)" stroke="#10b981" stroke-width="1.5"/>
  <text x="1192" y="415" text-anchor="middle" class="box-title">Private 投影头 × 2</text>
  <text x="1192" y="445" text-anchor="middle" class="body">Appearance：Ppri,a</text>
  <text x="1192" y="470" text-anchor="middle" class="body">Structure：Ppri,s</text>
  <text x="1192" y="502" text-anchor="middle" class="formula">1×1 Conv 128→32 + GN + GELU</text>

  <rect x="1075" y="565" width="235" height="115" rx="14"
        fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1192" y="596" text-anchor="middle" class="box-title">预测输出</text>
  <text x="1192" y="625" text-anchor="middle" class="body">Pa = softmax(logits a)</text>
  <text x="1192" y="652" text-anchor="middle" class="body">Ps = softmax(logits s)</text>

  <path d="M975 262 L1075 278" class="arrow"/>
  <path d="M975 402 L1075 458" class="arrow"/>
  <path d="M975 542 L1075 620" class="arrow"/>

  <!-- Loss blocks -->
  <rect x="1380" y="175" width="350" height="190" class="box"
        fill="url(#semanticFill)" stroke="#7c3aed"/>
  <text x="1555" y="208" text-anchor="middle" class="box-title">语义一致损失 Lsem</text>
  <text x="1555" y="240" text-anchor="middle" class="body">按类别聚合有效像素，计算双分支原型</text>
  <text x="1555" y="271" text-anchor="middle" class="formula">μv,c = Σ M(c)·Sv / Σ M(c)</text>
  <text x="1555" y="302" text-anchor="middle" class="formula">Lsem = mean_c [1 − cos(μa,c, μs,c)]</text>
  <rect x="1450" y="323" width="210" height="25" rx="12" fill="#7c3aed"/>
  <text x="1555" y="341" text-anchor="middle" class="badge">高层类别语义趋于一致</text>

  <rect x="1380" y="390" width="350" height="210" class="box"
        fill="url(#privateFill)" stroke="#059669"/>
  <text x="1555" y="423" text-anchor="middle" class="box-title">私有互补损失 Lcomp</text>
  <text x="1555" y="455" text-anchor="middle" class="body">逐像素通道 L2 归一化后计算 cosine</text>
  <text x="1555" y="486" text-anchor="middle" class="formula">Ldiv = mean ReLU(cos(Ra,Rs) − m)</text>
  <text x="1555" y="517" text-anchor="middle" class="formula">m = 0.2 · 达到差异后停止排斥</text>
  <text x="1555" y="548" text-anchor="middle" class="formula">Lcomp = Ldiv + 0.1 × Lvariance</text>
  <rect x="1450" y="563" width="210" height="25" rx="12" fill="#059669"/>
  <text x="1555" y="581" text-anchor="middle" class="badge">中层模态信息保持互补</text>

  <rect x="1380" y="625" width="350" height="105" class="box"
        fill="#f8fafc" stroke="#475569"/>
  <text x="1555" y="657" text-anchor="middle" class="box-title">分割与交叉伪监督</text>
  <text x="1555" y="687" text-anchor="middle" class="formula">Lsup：Seg(Pa,Y) + Seg(Ps,Y)</text>
  <text x="1555" y="714" text-anchor="middle" class="formula">LCPS：Seg(Pa,ŷs) + Seg(Ps,ŷa)</text>

  <path d="M1310 278 L1380 270" class="arrow"/>
  <path d="M1310 458 L1380 495" class="arrow"/>
  <path d="M1310 620 L1380 680" class="arrow"/>

  <!-- Target construction -->
  <text x="75" y="785" class="section">⑥ GT / 高置信伪标签与尺度对齐</text>
  <rect x="60" y="815" width="1670" height="210" class="box"
        fill="#ffffff" stroke="#cbd5e1"/>

  <rect x="90" y="850" width="235" height="130" rx="14"
        fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="207" y="881" text-anchor="middle" class="box-title">监督路径</text>
  <text x="207" y="913" text-anchor="middle" class="body">直接使用 GT mask</text>
  <text x="207" y="943" text-anchor="middle" class="formula">valid：0 ≤ Y &lt; C</text>
  <text x="207" y="968" text-anchor="middle" class="small">提供 Lsup、Lsem、Lcomp</text>

  <rect x="385" y="850" width="400" height="130" rx="14"
        fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="585" y="881" text-anchor="middle" class="box-title">无监督高置信共识</text>
  <text x="585" y="913" text-anchor="middle" class="formula">ŷa = argmax Pa · ŷs = argmax Ps</text>
  <text x="585" y="943" text-anchor="middle" class="formula">valid = (ŷa=ŷs) ∧ (ca≥0.7) ∧ (cs≥0.7)</text>
  <text x="585" y="968" text-anchor="middle" class="small">logits.detach()：标签构造不回传梯度</text>

  <rect x="845" y="850" width="350" height="130" rx="14"
        fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="1020" y="881" text-anchor="middle" class="box-title">分别缩放到特征层</text>
  <text x="1020" y="913" text-anchor="middle" class="body">最近邻 → H/4：语义原型 mask</text>
  <text x="1020" y="943" text-anchor="middle" class="body">最近邻 → H/2：私有互补 valid mask</text>
  <text x="1020" y="968" text-anchor="middle" class="small">保持离散类别与有效像素边界</text>

  <rect x="1255" y="850" width="435" height="130" rx="14"
        fill="#fff7ed" stroke="#f97316" stroke-width="1.4"/>
  <text x="1472" y="881" text-anchor="middle" class="box-title">原 CPS 伪标签路径保持不变</text>
  <text x="1472" y="913" text-anchor="middle" class="formula">ŷa = argmax logits a · ŷs = argmax logits s</text>
  <text x="1472" y="943" text-anchor="middle" class="body">用于双向 LCPS，不使用 0.7 阈值筛选</text>
  <text x="1472" y="968" text-anchor="middle" class="small">高置信筛选仅作用于新增 feature loss</text>

  <path d="M207 850 L207 830 L940 830 L940 850" class="arrow"/>
  <path d="M785 915 L845 915" class="arrow"/>
  <path d="M1020 850 L1020 780 L1750 780 L1750 270 L1730 270" class="arrow-loss"/>
  <path d="M1060 850 L1060 790 L1765 790 L1765 495 L1730 495" class="arrow-loss"/>
  <path d="M1472 850 L1472 730" class="arrow-loss"/>

  <!-- Total objective and optimization -->
  <text x="75" y="1080" class="section">⑦ 总损失、Ramp-up 与参数更新</text>

  <rect x="60" y="1110" width="1080" height="150" class="box"
        fill="url(#lossFill)" stroke="#e11d48"/>
  <text x="600" y="1144" text-anchor="middle" class="box-title">联合训练目标</text>
  <text x="600" y="1178" text-anchor="middle" class="formula">
    Lsupervised = Lsup + 0.1·Lsem,sup + 0.05·Lcomp,sup
  </text>
  <text x="600" y="1212" text-anchor="middle" class="formula">
    Lunsupervised = λu(t)·[LCPS + 0.1·Lsem,unsup + 0.05·Lcomp,unsup]
  </text>
  <text x="600" y="1242" text-anchor="middle" class="small">
    λu(t) = unsup_weight × (epoch + 1) / num_epochs
  </text>

  <rect x="1195" y="1110" width="535" height="150" class="box"
        fill="#eef2ff" stroke="#4f46e5"/>
  <text x="1462" y="1144" text-anchor="middle" class="box-title">反向传播与更新</text>
  <text x="1462" y="1178" text-anchor="middle" class="body">Optimizer a：Appearance XNet + Pa 投影头</text>
  <text x="1462" y="1210" text-anchor="middle" class="body">Optimizer s：Structure XNet + Ps 投影头</text>
  <text x="1462" y="1240" text-anchor="middle" class="small">投影头仅训练使用，不进入推理 checkpoint</text>

  <path d="M600 1025 L600 1110" class="arrow-loss"/>
  <path d="M1140 1185 L1195 1185" class="arrow-loss"/>
  <path d="M1462 1110 L1462 1060 L350 1060 L350 578 L385 578"
        class="arrow" stroke-dasharray="8 6"/>

  <!-- Footer note -->
  <rect x="60" y="1280" width="1670" height="24" rx="12" fill="#e2e8f0"/>
  <text x="895" y="1297" text-anchor="middle" class="small">
    模式隔离：feature_loss_mode=original 时，模型仍返回 (prediction, final_feature)，继续使用原始 FDCL 1/MSE 特征多样性损失。
  </text>
</svg>
